name: CI Pipeline

on:
  push:
    branches: [ main, master, staging ]
  pull_request:
    branches: [ main, master, staging ]

jobs:
  test:
    name: Run Automated Tests & Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate App Imports & Routes
        run: |
          python -c "import app.main; print('FastAPI App and Routers successfully loaded!')"

      - name: Execute BSF Auditoria Suite
        run: |
          python tests/test_bsf_auditoria_deduplicacao.py

      - name: Execute BSF Null Safety Suite
        run: |
          python tests/test_bsf_null_safety.py

      - name: Execute Full Test Runner
        run: |
          python tests/run_tests.py
